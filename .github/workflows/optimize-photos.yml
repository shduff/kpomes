name: Optimize photo display copies
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/optimize_photos.py'
      - '.github/workflows/optimize-photos.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python scripts/optimize_photos.py
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/optimized
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized WebP display copies"
            git push
          fi
